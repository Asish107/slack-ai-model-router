name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked_env_files="$({ git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; } || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Tracked environment files are not allowed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

  container:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag slack-model-router:ci .

      - name: Verify packaged application
        run: docker run --rm slack-model-router:ci python -c "import bot; print('container-import-ok')"
